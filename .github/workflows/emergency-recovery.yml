name: Emergency Userbot Recovery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Telegram Userbot"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: emergency-userbot-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check for an active Userbot run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== Emergency Userbot Recovery ==="
          echo "Trigger: ${{ github.event_name }}"

          get_active_runs() {
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/bot.yml/runs?per_page=20" \
              | python -c '
          import json,sys
          d=json.load(sys.stdin)
          active={"queued","in_progress","waiting","requested","pending"}
          runs=[r for r in d.get("workflow_runs",[]) if r.get("status") in active]
          print(len(runs))
          for r in runs:
              print(f"{r.get(\"id\")} {r.get(\"run_number\")} {r.get(\"status\")} {r.get(\"created_at\")}")
          '
          }

          echo "First active-run check:"
          first="$(get_active_runs)"
          printf '%s\n' "$first"

          count="$(printf '%s\n' "$first" | head -n1)"
          if [ "$count" -gt 0 ]; then
            echo "ACTIVE USERBOT RUN FOUND. No recovery required."
            exit 0
          fi

          # Avoid racing with the normal 5h45m handoff: a new run may be
          # between dispatch and becoming visible in the workflow-runs API.
          echo "No active run found. Waiting 60 seconds before the final check..."
          sleep 60

          echo "Final active-run check:"
          second="$(get_active_runs)"
          printf '%s\n' "$second"

          count="$(printf '%s\n' "$second" | head -n1)"
          if [ "$count" -gt 0 ]; then
            echo "ACTIVE USERBOT RUN FOUND AFTER RECHECK. No recovery required."
            exit 0
          fi

          echo "NO ACTIVE USERBOT RUN FOUND. Dispatching emergency replacement."

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"clean-main"}')"

          if [ "$http_code" != "204" ]; then
            echo "Emergency dispatch failed with HTTP ${http_code}."
            cat "$response_file"
            exit 1
          fi

          echo "Emergency replacement dispatched successfully."
