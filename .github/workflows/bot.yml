name: Telegram Userbot

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Only ONE Telegram Userbot workflow can run at a time.
concurrency:
  group: telegram-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    # Keep the whole job below GitHub-hosted runner's 6-hour limit.
    timeout-minutes: 359

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            aiohttp==3.11.11 \
            beautifulsoup4==4.12.3 \
            edge-tts==7.2.8 \
            GitPython==3.1.44 \
            google-generativeai==0.8.6 \
            lxml==6.1.2 \
            motor==3.6.0 \
            openai==2.28.0 \
            pillow==11.1.0 \
            psutil==7.2.2 \
            py-tgcalls==2.3.3 \
            pyfiglet==1.0.2 \
            pymongo==4.9.2 \
            python-dotenv==1.0.1 \
            python-telegram-bot==21.10 \
            replit==4.1.2 \
            requests==2.32.3 \
            rich==13.9.3 \
            speedtest-cli==2.1.3 \
            Telethon==1.44.0 \
            yt-dlp==2026.8.19

      - name: Download Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

      - name: Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINI_APP_PUBLIC_PATH: /mini-app/
          GITHUB_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARED_PID=""
          BOT_PID=""
          TUNNEL_URL=""

          # ==========================================
          # CLEANUP
          # ==========================================

          cleanup() {
            echo "=========================================="
            echo "Cleanup started..."
            echo "=========================================="

            if [ -n "${BOT_PID:-}" ]; then
              echo "Stopping Telegram Bot PID: $BOT_PID"

              kill "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
            fi

            if [ -n "${CLOUDFLARED_PID:-}" ]; then
              echo "Stopping Cloudflare PID: $CLOUDFLARED_PID"

              kill "$CLOUDFLARED_PID" 2>/dev/null || true
              wait "$CLOUDFLARED_PID" 2>/dev/null || true
            fi

            echo "Cleanup completed."
          }

          trap cleanup EXIT INT TERM

          # ==========================================
          # START CLOUDFLARE
          # ==========================================

          start_tunnel() {
            rm -f cloudflared.log

            echo "Starting Cloudflare Quick Tunnel..."

            nohup ./cloudflared tunnel \
              --url http://127.0.0.1:8008 \
              > cloudflared.log 2>&1 &

            CLOUDFLARED_PID=$!

            echo "Cloudflare PID: $CLOUDFLARED_PID"

            for i in {1..30}; do

              TUNNEL_URL=$(
                grep -oE \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  cloudflared.log \
                  | head -n 1 || true
              )

              if [ -n "$TUNNEL_URL" ]; then
                echo "=========================================="
                echo "Cloudflare Tunnel is ONLINE"
                echo "$TUNNEL_URL"
                echo "=========================================="

                return 0
              fi

              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                echo "Cloudflare Tunnel process exited."

                cat cloudflared.log || true

                return 1
              fi

              sleep 2
            done

            echo "Could not obtain Cloudflare Tunnel URL."

            cat cloudflared.log || true

            return 1
          }

          # ==========================================
          # STOP CLOUDFLARE
          # ==========================================

          stop_tunnel() {
            if [ -n "${CLOUDFLARED_PID:-}" ]; then

              echo "Stopping Cloudflare PID: $CLOUDFLARED_PID"

              kill "$CLOUDFLARED_PID" 2>/dev/null || true
              wait "$CLOUDFLARED_PID" 2>/dev/null || true

              CLOUDFLARED_PID=""
            fi
          }

          # ==========================================
          # START BOT
          # ==========================================

          start_bot() {
            echo "=========================================="
            echo "Starting Telegram Userbot..."
            echo "=========================================="

            echo "MINI_APP_URL=$TUNNEL_URL"

            MINI_APP_URL="$TUNNEL_URL" \
            PYTHONPATH="$GITHUB_WORKSPACE/telegram_userbot" \
            python -m telegram_userbot.main &

            BOT_PID=$!

            echo "Telegram Bot PID: $BOT_PID"

            for i in {1..30}; do

              if curl -fsS --max-time 5 \
                http://127.0.0.1:8008/mini-app/ \
                > /dev/null; then

                echo "=========================================="
                echo "Mini App is ONLINE"
                echo "=========================================="

                return 0
              fi

              if ! kill -0 "$BOT_PID" 2>/dev/null; then

                echo "Telegram Bot process exited unexpectedly."

                wait "$BOT_PID" 2>/dev/null || true

                return 1
              fi

              sleep 2
            done

            echo "Mini App did not become ready."

            return 1
          }

          # ==========================================
          # STOP BOT
          # ==========================================

          stop_bot() {
            if [ -n "${BOT_PID:-}" ]; then

              echo "Stopping Telegram Bot PID: $BOT_PID"

              kill "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true

              BOT_PID=""
            fi
          }

          # ==========================================
          # RESTART EVERYTHING
          # ==========================================

          restart_services() {
            echo "=========================================="
            echo "Restarting services..."
            echo "=========================================="

            stop_bot
            stop_tunnel

            sleep 3

            if ! start_tunnel; then
              echo "Failed to restart Cloudflare Tunnel."
              return 1
            fi

            if ! start_bot; then
              echo "Failed to restart Telegram Userbot."
              return 1
            fi

            echo "=========================================="
            echo "Recovery successful."
            echo "=========================================="

            return 0
          }

          # ==========================================
          # INITIAL START
          # ==========================================

          echo "=========================================="
          echo "Telegram Userbot starting..."
          echo "=========================================="

          if ! start_tunnel; then
            echo "Initial Cloudflare Tunnel startup failed."
            exit 1
          fi

          if ! start_bot; then
            echo "Initial Telegram Userbot startup failed."
            exit 1
          fi

          echo "=========================================="
          echo "TELEGRAM USERBOT IS ONLINE"
          echo "=========================================="

          # ==========================================
          # 5 HOURS 45 MINUTES SERVICE RUNTIME
          #
          # 5h45m = 20700 seconds
          #
          # This leaves time for:
          # - checkout
          # - Python setup
          # - package installation
          # - Cloudflare download
          # - cleanup
          #
          # before GitHub's 6-hour hosted-runner limit.
          # ==========================================

          MAX_RUNTIME_SECONDS=20700
          START_TIME=$(date +%s)

          echo "Automatic restart cycle:"
          echo "5 hours 45 minutes service runtime."

          WATCHDOG_FAILURES=0

          # ==========================================
          # MAIN WATCHDOG LOOP
          # ==========================================

          while true; do

            sleep 60

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            echo "------------------------------------------"
            echo "Watchdog check"
            echo "Runtime: ${ELAPSED}s / ${MAX_RUNTIME_SECONDS}s"

            # ========================================
            # TIME LIMIT
            # ========================================

            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ]; then

              echo "=========================================="
              echo "5 hours 45 minutes completed."
              echo "Stopping current workflow cleanly."
              echo "Watchdog workflow will start the next run."
              echo "=========================================="

              break
            fi

            # ========================================
            # CHECK CLOUDFLARED PROCESS
            # ========================================

            if [ -z "${CLOUDFLARED_PID:-}" ] || \
               ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

              echo "Watchdog: Cloudflare process is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            # ========================================
            # CHECK BOT PROCESS
            # ========================================

            elif [ -z "${BOT_PID:-}" ] || \
                 ! kill -0 "$BOT_PID" 2>/dev/null; then

              echo "Watchdog: Telegram Bot process is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            # ========================================
            # CHECK LOCAL MINI APP
            # ========================================

            elif ! curl -fsS --max-time 15 \
              http://127.0.0.1:8008/mini-app/ \
              > /dev/null; then

              echo "Watchdog: Local Mini App is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            # ========================================
            # CHECK PUBLIC CLOUDFLARE URL
            # ========================================

            elif ! curl -fsS --max-time 15 \
              "$TUNNEL_URL/mini-app/" \
              > /dev/null; then

              echo "Watchdog: Public Cloudflare Tunnel is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            else

              WATCHDOG_FAILURES=0

              echo "Watchdog: Everything is healthy."

            fi

            # ========================================
            # RECOVER AFTER 2 FAILED CHECKS
            # ========================================

            if [ "$WATCHDOG_FAILURES" -ge 2 ]; then

              echo "=========================================="
              echo "Watchdog detected a service failure."
              echo "Starting recovery..."
              echo "=========================================="

              if restart_services; then

                WATCHDOG_FAILURES=0

                echo "Watchdog: recovery successful."

              else

                echo "Watchdog: recovery failed."

                WATCHDOG_FAILURES=0

              fi

            fi

          done

          echo "=========================================="
          echo "Current workflow is shutting down."
          echo "Next workflow will be started by Watchdog."
          echo "=========================================="

          exit 0
