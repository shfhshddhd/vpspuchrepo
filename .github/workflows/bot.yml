name: Telegram Userbot

run-name: Telegram Userbot${{ inputs.handoff_id != '' && format(' | Handoff {0}', inputs.handoff_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      handoff_id:
        description: "Automatic handoff ID"
        required: false
        type: string
        default: ""

      previous_run_id:
        description: "Previous Userbot run ID"
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 359

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      # ==========================================================
      # PYTHON DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            aiohttp==3.11.11 \
            beautifulsoup4==4.12.3 \
            edge-tts==7.2.8 \
            GitPython==3.1.44 \
            google-generativeai==0.8.6 \
            lxml==6.1.2 \
            motor==3.6.0 \
            openai==2.28.0 \
            pillow==11.1.0 \
            psutil==7.2.2 \
            py-tgcalls==2.3.3 \
            pyfiglet==1.0.2 \
            pymongo==4.9.2 \
            python-dotenv==1.0.1 \
            python-telegram-bot==21.10 \
            replit==4.1.2 \
            requests==2.32.3 \
            rich==13.9.3 \
            speedtest-cli==2.1.3 \
            Telethon==1.44.0 \
            yt-dlp==2026.8.19

      # ==========================================================
      # CLOUDFLARE QUICK TUNNEL
      # ==========================================================

      - name: Download Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

      # ==========================================================
      # START USERBOT
      # ==========================================================

      - name: Start Telegram Userbot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          MINI_APP_PUBLIC_PATH: /mini-app/
          GITHUB_TOKEN: ${{ github.token }}

          HANDOFF_ID: ${{ inputs.handoff_id }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}

        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${GITHUB_REPOSITORY}"
          BOT_WORKFLOW="bot.yml"
          BOT_BRANCH="clean-main"
          CURRENT_RUN_ID="${GITHUB_RUN_ID}"

          CLOUDFLARED_PID=""
          BOT_PID=""
          TUNNEL_URL=""

          HANDOFF_STARTED=0
          WATCHDOG_FAILURES=0

          MAX_RUNTIME_SECONDS=20700

          # ========================================================
          # GITHUB API
          # ========================================================

          github_api_get() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }

          # ========================================================
          # CLEANUP
          # ========================================================

          cleanup() {

            echo "=========================================="
            echo "Cleanup started"
            echo "=========================================="

            if [ -n "${BOT_PID:-}" ]; then

              kill "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true

              BOT_PID=""
            fi

            if [ -n "${CLOUDFLARED_PID:-}" ]; then

              kill "$CLOUDFLARED_PID" 2>/dev/null || true
              wait "$CLOUDFLARED_PID" 2>/dev/null || true

              CLOUDFLARED_PID=""
            fi

            echo "Cleanup completed"
          }

          trap cleanup EXIT INT TERM

          # ========================================================
          # START CLOUDFLARE
          # ========================================================

          start_tunnel() {

            rm -f cloudflared.log

            echo "=========================================="
            echo "Starting Cloudflare Quick Tunnel"
            echo "=========================================="

            nohup ./cloudflared tunnel \
              --url http://127.0.0.1:8008 \
              > cloudflared.log 2>&1 &

            CLOUDFLARED_PID=$!

            echo "Cloudflare PID: $CLOUDFLARED_PID"

            for i in {1..45}; do

              TUNNEL_URL="$(
                grep -oE \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  cloudflared.log \
                  | head -n 1 || true
              )"

              if [ -n "$TUNNEL_URL" ]; then

                echo "=========================================="
                echo "Cloudflare Tunnel ONLINE"
                echo "$TUNNEL_URL"
                echo "=========================================="

                return 0
              fi

              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

                echo "Cloudflare process exited."

                cat cloudflared.log || true

                return 1
              fi

              sleep 2

            done

            echo "Cloudflare URL was not detected."

            cat cloudflared.log || true

            return 1
          }

          # ========================================================
          # STOP CLOUDFLARE
          # ========================================================

          stop_tunnel() {

            if [ -n "${CLOUDFLARED_PID:-}" ]; then

              kill "$CLOUDFLARED_PID" 2>/dev/null || true
              wait "$CLOUDFLARED_PID" 2>/dev/null || true

              CLOUDFLARED_PID=""
            fi
          }

          # ========================================================
          # START TELEGRAM USERBOT
          # ========================================================

          start_bot() {

            echo "=========================================="
            echo "Starting Telegram Userbot"
            echo "=========================================="

            echo "MINI_APP_URL=$TUNNEL_URL"

            MINI_APP_URL="$TUNNEL_URL" \
            PYTHONPATH="$GITHUB_WORKSPACE/telegram_userbot" \
            python -m telegram_userbot.main &

            BOT_PID=$!

            echo "Telegram Userbot PID: $BOT_PID"

            for i in {1..45}; do

              if curl -fsS \
                --max-time 5 \
                http://127.0.0.1:8008/mini-app/ \
                > /dev/null; then

                echo "=========================================="
                echo "Mini App ONLINE"
                echo "=========================================="

                return 0
              fi

              if ! kill -0 "$BOT_PID" 2>/dev/null; then

                echo "Telegram Userbot process exited."

                wait "$BOT_PID" 2>/dev/null || true

                return 1
              fi

              sleep 2

            done

            echo "Mini App did not become ready."

            return 1
          }

          # ========================================================
          # STOP TELEGRAM USERBOT
          # ========================================================

          stop_bot() {

            if [ -n "${BOT_PID:-}" ]; then

              kill "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true

              BOT_PID=""
            fi
          }

          # ========================================================
          # RESTART SERVICES
          # ========================================================

          restart_services() {

            echo "=========================================="
            echo "Restarting services"
            echo "=========================================="

            stop_bot
            stop_tunnel

            sleep 3

            if ! start_tunnel; then
              return 1
            fi

            if ! start_bot; then
              return 1
            fi

            return 0
          }

          # ========================================================
          # CHECK RUN STATUS
          # ========================================================

          get_run_status() {

            local RUN_ID="$1"
            local DATA

            DATA="$(
              github_api_get \
                "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID" \
                || true
            )"

            echo "$DATA" |
              python3 -c '
import json
import sys

try:
    print(json.load(sys.stdin).get("status", "unknown"))
except Exception:
    print("unknown")
'
          }

          # ========================================================
          # CANCEL RUN
          # ========================================================

          cancel_run() {

            local RUN_ID="$1"

            if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              return 1
            fi

            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "Refusing to cancel current run."
              return 1
            fi

            for ATTEMPT in 1 2 3 4 5; do

              echo "Cancel attempt $ATTEMPT for run $RUN_ID"

              HTTP_CODE="$(
                curl -sS \
                  -o /tmp/cancel-response.txt \
                  -w "%{http_code}" \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/cancel" \
                  || true
              )"

              if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "409" ]; then

                echo "Cancellation accepted for run $RUN_ID"

                return 0
              fi

              cat /tmp/cancel-response.txt || true

              sleep 5

            done

            return 1
          }

          # ========================================================
          # FIND OLDER ACTIVE RUNS
          #
          # This prevents manually started duplicate runs from
          # permanently creating multiple Userbot instances.
          #
          # The newest run becomes the replacement candidate.
          # It verifies itself first, then cancels older runs.
          # ========================================================

          find_older_active_runs() {

            github_api_get \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$BOT_WORKFLOW/runs?branch=$BOT_BRANCH&per_page=50" |
              python3 -c '
import json
import sys

try:
    data = json.load(sys.stdin)
except Exception:
    sys.exit(0)

current = int(sys.argv[1])

active = {
    "queued",
    "in_progress",
    "waiting",
    "requested",
    "pending"
}

for run in data.get("workflow_runs", []):
    rid = int(run.get("id", 0))
    status = run.get("status")

    if rid != current and rid < current and status in active:
        print(rid)
' "$CURRENT_RUN_ID"
          }

          # ========================================================
          # INITIAL INFORMATION
          # ========================================================

          echo "=========================================="
          echo "Telegram Userbot"
          echo "=========================================="
          echo "Repository : $REPOSITORY"
          echo "Branch     : $BOT_BRANCH"
          echo "Current Run: $CURRENT_RUN_ID"
          echo "Handoff ID : ${HANDOFF_ID:-none}"
          echo "Previous   : ${PREVIOUS_RUN_ID:-none}"
          echo "=========================================="

          # ========================================================
          # START CLOUDFLARE
          # ========================================================

          if ! start_tunnel; then

            echo "Initial Cloudflare startup failed."

            exit 1
          fi

          # ========================================================
          # START USERBOT
          # ========================================================

          if ! start_bot; then

            echo "Initial Userbot startup failed."

            exit 1
          fi

          # ========================================================
          # FINAL HEALTH VERIFICATION
          # ========================================================

          echo "=========================================="
          echo "Final health verification"
          echo "=========================================="

          HEALTH_OK=1

          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

            echo "FAIL: Cloudflare process is down."

            HEALTH_OK=0
          fi

          if ! kill -0 "$BOT_PID" 2>/dev/null; then

            echo "FAIL: Userbot process is down."

            HEALTH_OK=0
          fi

          if ! curl -fsS \
            --max-time 15 \
            http://127.0.0.1:8008/mini-app/ \
            > /dev/null; then

            echo "FAIL: Local Mini App is down."

            HEALTH_OK=0
          fi

          if ! curl -fsS \
            --max-time 15 \
            "$TUNNEL_URL/mini-app/" \
            > /dev/null; then

            echo "FAIL: Public Mini App is down."

            HEALTH_OK=0
          fi

          if [ "$HEALTH_OK" -ne 1 ]; then

            echo "=========================================="
            echo "HEALTH VERIFICATION FAILED"
            echo "=========================================="

            exit 1
          fi

          echo "=========================================="
          echo "USERBOT HEALTH VERIFICATION PASSED"
          echo "=========================================="

          # ========================================================
          # DETERMINE OLDER RUNS
          # ========================================================

          OLDER_RUNS=""

          if [ -n "${PREVIOUS_RUN_ID:-}" ]; then

            OLDER_RUNS="$PREVIOUS_RUN_ID"

          else

            OLDER_RUNS="$(
              find_older_active_runs || true
            )"

          fi

          # ========================================================
          # CANCEL OLDER RUNS ONLY AFTER THIS RUN IS HEALTHY
          # ========================================================

          if [ -n "$OLDER_RUNS" ]; then

            echo "=========================================="
            echo "Older active Userbot runs detected"
            echo "=========================================="

            for OLD_RUN_ID in $OLDER_RUNS; do

              if [[ "$OLD_RUN_ID" =~ ^[0-9]+$ ]]; then

                OLD_STATUS="$(get_run_status "$OLD_RUN_ID")"

                echo "Old run $OLD_RUN_ID status: $OLD_STATUS"

                case "$OLD_STATUS" in

                  queued|in_progress|waiting|requested|pending)

                    cancel_run "$OLD_RUN_ID" || true

                    ;;

                esac

              fi

            done

          fi

          # ========================================================
          # START 5H45 SERVICE TIMER
          # ========================================================

          START_TIME="$(date +%s)"

          echo "=========================================="
          echo "USERBOT IS FULLY ONLINE"
          echo "=========================================="
          echo "Runtime target : 5 hours 45 minutes"
          echo "Runtime        : 20700 seconds"
          echo "Run ID         : $CURRENT_RUN_ID"
          echo "Tunnel         : $TUNNEL_URL"
          echo "=========================================="

          # ========================================================
          # MAIN LOOP
          # ========================================================

          while true; do

            sleep 60

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START_TIME))

            echo "------------------------------------------"
            echo "Run ID : $CURRENT_RUN_ID"
            echo "Runtime: ${ELAPSED}s / ${MAX_RUNTIME_SECONDS}s"
            echo "------------------------------------------"

            # ======================================================
            # 5H45 AUTOMATIC HANDOFF
            # ======================================================

            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ] &&
               [ "$HANDOFF_STARTED" -eq 0 ]; then

              HANDOFF_STARTED=1

              NEXT_HANDOFF_ID="handoff-${CURRENT_RUN_ID}-$(date +%s)"

              echo "=========================================="
              echo "5 HOURS 45 MINUTES REACHED"
              echo "=========================================="
              echo "Starting NEW replacement run"
              echo "Old Run: $CURRENT_RUN_ID"
              echo "Handoff: $NEXT_HANDOFF_ID"
              echo "=========================================="

              NEW_RUN_ID=""

              for ATTEMPT in 1 2 3 4 5; do

                echo "Dispatch attempt $ATTEMPT / 5"

                RESPONSE_FILE="/tmp/dispatch-response.json"

                HTTP_CODE="$(
                  curl -sS \
                    -o "$RESPONSE_FILE" \
                    -w "%{http_code}" \
                    -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "X-GitHub-Api-Version: 2026-03-10" \
                    -H "Content-Type: application/json" \
                    "https://api.github.com/repos/$REPOSITORY/actions/workflows/$BOT_WORKFLOW/dispatches" \
                    -d "{
                      \"ref\": \"$BOT_BRANCH\",
                      \"return_run_details\": true,
                      \"inputs\": {
                        \"handoff_id\": \"$NEXT_HANDOFF_ID\",
                        \"previous_run_id\": \"$CURRENT_RUN_ID\"
                      }
                    }" \
                    || true
                )"

                echo "Dispatch HTTP status: $HTTP_CODE"

                if [ "$HTTP_CODE" = "200" ]; then

                  NEW_RUN_ID="$(
                    python3 -c '
import json
import sys

try:
    with open(sys.argv[1], "r", encoding="utf-8") as f:
        data = json.load(f)

    print(data.get("workflow_run_id", ""))

except Exception:
    print("")
' "$RESPONSE_FILE"
                  )"

                  if [[ "$NEW_RUN_ID" =~ ^[0-9]+$ ]]; then

                    echo "=========================================="
                    echo "NEW WORKFLOW CREATED"
                    echo "=========================================="
                    echo "New Run ID: $NEW_RUN_ID"
                    echo "Old Run ID: $CURRENT_RUN_ID"
                    echo "=========================================="

                    break
                  fi

                fi

                cat "$RESPONSE_FILE" || true

                if [ "$ATTEMPT" -lt 5 ]; then
                  sleep 15
                fi

              done

              # ====================================================
              # WAIT FOR NEW RUN
              # ====================================================

              if [[ "$NEW_RUN_ID" =~ ^[0-9]+$ ]]; then

                echo "Waiting for new runner..."

                NEW_RUN_STARTED=0

                for CHECK in {1..90}; do

                  NEW_STATUS="$(get_run_status "$NEW_RUN_ID")"

                  echo "New run status: $NEW_STATUS"

                  if [ "$NEW_STATUS" = "in_progress" ]; then

                    NEW_RUN_STARTED=1

                    echo "=========================================="
                    echo "NEW RUNNER IS ACTIVE"
                    echo "=========================================="

                    break
                  fi

                  if [ "$NEW_STATUS" = "completed" ]; then

                    echo "New run completed before becoming active."

                    break
                  fi

                  sleep 10

                done

                # ==================================================
                # DO NOT CANCEL OLD RUN HERE
                #
                # The NEW run receives previous_run_id.
                #
                # It will:
                # 1. Start Cloudflare
                # 2. Start Userbot
                # 3. Verify Mini App
                # 4. Verify public tunnel
                # 5. Cancel THIS old run
                #
                # This guarantees new-first verification.
                # ==================================================

                if [ "$NEW_RUN_STARTED" -eq 1 ]; then

                  echo "New runner started."
                  echo "Waiting for new runner health verification."

                  for WAIT in {1..90}; do

                    CURRENT_STATUS="$(get_run_status "$CURRENT_RUN_ID")"

                    echo "Current run status: $CURRENT_STATUS"

                    if [ "$CURRENT_STATUS" = "completed" ]; then

                      echo "=========================================="
                      echo "OLD RUN WAS CANCELLED"
                      echo "HANDOFF COMPLETED"
                      echo "=========================================="

                      exit 0
                    fi

                    sleep 10

                  done

                  echo "New run did not cancel old run yet."
                  echo "Old run will continue safely."

                fi

              else

                echo "=========================================="
                echo "NEW RUN COULD NOT BE STARTED"
                echo "=========================================="
                echo "Current Userbot will continue."
                echo "Watchdog can recover it."
                echo "=========================================="

              fi

            fi

            # ======================================================
            # HEALTH CHECK
            # ======================================================

            if [ -z "${CLOUDFLARED_PID:-}" ] ||
               ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

              echo "Cloudflare is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            elif [ -z "${BOT_PID:-}" ] ||
                 ! kill -0 "$BOT_PID" 2>/dev/null; then

              echo "Telegram Userbot is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            elif ! curl -fsS \
              --max-time 15 \
              http://127.0.0.1:8008/mini-app/ \
              > /dev/null; then

              echo "Local Mini App is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            elif ! curl -fsS \
              --max-time 15 \
              "$TUNNEL_URL/mini-app/" \
              > /dev/null; then

              echo "Public Cloudflare Tunnel is DOWN."

              WATCHDOG_FAILURES=$((WATCHDOG_FAILURES + 1))

            else

              WATCHDOG_FAILURES=0

              echo "Everything is healthy."

            fi

            # ======================================================
            # LOCAL RECOVERY
            # ======================================================

            if [ "$WATCHDOG_FAILURES" -ge 2 ]; then

              echo "=========================================="
              echo "SERVICE FAILURE DETECTED"
              echo "Attempting recovery"
              echo "=========================================="

              if restart_services; then

                WATCHDOG_FAILURES=0

                echo "Recovery successful."

              else

                WATCHDOG_FAILURES=0

                echo "Recovery failed."
                echo "Current workflow remains alive."

              fi

            fi

          done
